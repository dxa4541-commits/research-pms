<text x="40" y="28" class="h" text-anchor="start">Class Diagram</text>
<rect class="cls" x="80" y="55" width="170" height="59"/><rect class="hd" x="80" y="55" width="170" height="30"/><text x="165.0" y="75" class="t b" text-anchor="middle">client</text><text x="90" y="102" class="s" text-anchor="start">browser (HTML/JS)</text>
